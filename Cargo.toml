[package]
name = "filesplit"
version = "1.0.0"
edition = "2021"
authors = ["Data Engineering CLI"]
description = "Safe, streaming CSV and text file splitter with row-boundary awareness"
license = "MIT"
keywords = ["csv", "split", "data-engineering", "cli", "streaming"]
categories = ["command-line-utilities", "parser-implementations"]

[[bin]]
name = "filesplit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
csv = "1.3"
indicatif = { version = "0.17", features = ["rayon"] }
humansize = "2.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
