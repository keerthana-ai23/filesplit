[package]
name = "filesplit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "filesplit"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config file support (TOML)
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# CSV-safe parsing (handles quoted fields, escapes, etc.)
csv = "1.3"

# Human-readable byte sizes like "1GB", "128MB"
bytesize = "1.3"

# Progress bar
indicatif = "0.17"

# Error handling
anyhow = "1"
thiserror = "1"
colored = "3.1.1"
humansize = "2.1.3"
serde_json = "1.0.149"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "split_bench"
harness = false
